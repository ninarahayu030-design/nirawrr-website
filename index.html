<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nira's Little World 🐈</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap');

:root {
  --pink: #ffb6cc;
  --hot-pink: #f47da8;
  --light-pink: #fff0f5;
  --purple: #d9c5f5;
  --text: #715565;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: 'Nunito', sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at 10% 10%, #ffe0eb 0%, transparent 40%),
    radial-gradient(ellipse at 90% 60%, #eee2ff 0%, transparent 38%),
    #fff9fb;
  overflow-x: hidden;
}

button, a {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(100% - 32px, 700px);
  margin: auto;
}

/* NAVIGATION */

nav {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(255, 249, 251, 0.88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #ffe0eb;
}

.nav-inner {
  max-width: 700px;
  margin: auto;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-weight: 900;
  font-size: 20px;
  color: var(--hot-pink);
}

.nav-link {
  font-size: 13px;
  font-weight: 800;
  background: white;
  padding: 9px 14px;
  border-radius: 30px;
  border: 1px solid #ffe0eb;
}

/* HERO */

.hero {
  text-align: center;
  padding: 45px 0 30px;
}

.eyebrow {
  display: inline-block;
  padding: 7px 15px;
  border: 1px solid #ffd4e2;
  border-radius: 30px;
  background: rgba(255,255,255,0.8);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
}

.cat-frame {
  width: 160px;
  height: 160px;
  margin: 25px auto 20px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #ffdce8, #e8dcff);
  border: 5px solid white;
  border-radius: 42% 58% 48% 52% / 52% 43% 57% 48%;
  box-shadow: 0 10px 30px #edb8d366;
  animation: float 3s ease-in-out infinite;
}

.cat {
  font-size: 91px;
  filter: drop-shadow(0 5px 3px #b86c8a30);
}

h1 {
  margin: 0;
  font-size: clamp(32px, 8vw, 47px);
  line-height: 1.2;
  font-weight: 900;
  color: #df7098;
}

h1 span {
  color: #b69bdf;
}

.subtitle {
  max-width: 360px;
  margin: 14px auto 20px;
  font-family: 'Quicksand', sans-serif;
