<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Paw Clicker 🐾</title>
  
  <!-- Font Cute dari Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
      font-family: 'Fredoka', cursive, sans-serif;
      overflow: hidden;
    }

    /* Box Skor */
    .score-board {
      background: #ffffff;
      padding: 15px 40px;
      border-radius: 25px;
      box-shadow: 0 10px 25px rgba(255, 143, 163, 0.4);
      border: 4px solid #ff8fa3;
      margin-bottom: 50px;
      text-align: center;
      transform: scale(1);
      transition: transform 0.1s ease;
    }

    .score-title {
      font-size: 1.2rem;
      color: #ff758f;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .score-number {
      font-size: 3rem;
      color: #ff4d6d;
      font-weight: 700;
      line-height: 1.1;
    }

    /* Container Tombol & Floating Text */
    .paw-container {
      position: relative;
    }

    /* Tombol Bulat Paw */
    .paw-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: #ff8fa3;
      border: 6px solid #ffffff;
      box-shadow: 0 12px 0px #ff4d6d, 0 15px 30px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      transition: all 0.08s ease;
      position: relative;
      touch-action: manipulation;
    }

    .paw-btn:active {
      transform: translateY(8px);
      box-shadow: 0 4px 0px #ff4d6d, 0 8px 15px rgba(0, 0, 0, 0.1);
    }

    /* Icon SVG Paw Kucing */
    .paw-icon {
      width: 110px;
      height: 110px;
      fill: #ffffff;
      filter: drop-shadow(0 4px 2px rgba(255, 77, 109, 0.3));
    }

    /* Animasi +1 Melayang */
    .plus-one {
      position: absolute;
      font-size: 2.2rem;
      font-weight: 700;
      color: #ff4d6d;
      text-shadow: 2px 2px 0px #ffffff;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-50px) scale(1.3);
      }
      100% {
        opacity: 0;
        transform: translateY(-90px) scale(1);
      }
    }
  </style>
</head>
<body>

  <!-- Area Skor -->
  <div class="score-board" id="scoreBoard">
    <div class="score-title">SCORE</div>
    <div class="score-number" id="score">0</div>
  </div>

  <!-- Area Tombol Bulat Paws -->
  <div class="paw-container" id="pawContainer">
    <button class="paw-btn" id="pawBtn">
      <svg class="paw-icon" viewBox="0 0 100 100">
        <!-- Pad Utama -->
        <path d="M 50 45 C 32 45, 25 62, 30 78 C 35 90, 65 90, 70 78 C 75 62, 68 45, 50 45 Z" />
        <!-- Jari-Jari (Toe Beans) -->
        <circle cx="26" cy="36" r="10" />
        <circle cx="42" cy="24" r="11" />
        <circle cx="58" cy="24" r="11" />
        <circle cx="74" cy="36" r="10" />
      </svg>
    </button>
  </div>

  <script>
    let score = 0;
    const scoreEl = document.getElementById('score');
    const scoreBoard = document.getElementById('scoreBoard');
    const pawBtn = document.getElementById('pawBtn');
    const pawContainer = document.getElementById('pawContainer');

    // Inisialisasi Audio Context untuk Suara Meow Sintesis
    let audioCtx = null;

    function playMeowSound() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';

      const now = audioCtx.currentTime;
      
      // Frekuensi suara meow (naik lalu turun perlahan)
      osc.frequency.setValueAtTime(380, now);
      osc.frequency.exponentialRampToValueAtTime(780, now + 0.12);
      osc.frequency.exponentialRampToValueAtTime(320, now + 0.35);

      // Amplitudo / Volume suara
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.25, now + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.35);
    }

    function createFloatingText(e) {
      const floatEl = document.createElement('div');
      floatEl.className = 'plus-one';
      floatEl.innerText = '+1';

      // Hitung posisi relatif klik/tap di dalam container tombol
      const rect = pawContainer.getBoundingClientRect();
      let x = e.clientX ? (e.clientX - rect.left - 20) : (rect.width / 2 - 20);
      let y = e.clientY ? (e.clientY - rect.top - 40) : 0;

      // Random offset sedikit agar animasi mekar cantik
      const randomOffsetX = (Math.random() - 0.5) * 40;
      x += randomOffsetX;

      floatEl.style.left = `${x}px`;
      floatEl.style.top = `${y}px`;

      pawContainer.appendChild(floatEl);

      // Hapus elemen setelah animasi selesai
      setTimeout(() => {
        floatEl.remove();
      }, 800);
    }

    function handleClick(e) {
      // Tambah Skor
      score++;
      scoreEl.innerText = score;

      // Efek denyut pada papan skor
      scoreBoard.style.transform = 'scale(1.08)';
      setTimeout(() => {
        scoreBoard.style.transform = 'scale(1)';
      }, 100);

      // Mainkan suara meow & buat animasi +1
      playMeowSound();
      createFloatingText(e);
    }

    pawBtn.addEventListener('click', handleClick);
  </script>

</body>
</html>
